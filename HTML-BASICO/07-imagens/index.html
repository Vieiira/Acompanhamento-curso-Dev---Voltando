<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>
    <h1>Imagens</h1>

    <img src="./images/Captura de tela 2026-07-02 114912.png" alt="imagem do tenis" title="Imagem de tenis">

    <!-- a tag img nao tem fechamento igual o h1 e etc, o src vai servir para colocar nossa imagem ou link dela para aparecer no nosso site !
    e o alt serve para quando o cliente nao conseguir carregar a imagem ter alguma descriçao 
    e o title serve para mostrar uma descriçao quando colocar o mouse em cima 
    -->

    <img src="https://placehold.co/150" alt="placeholder">

    <!-- Essa é uma imagem sem precisar ter o arquivo local dela, somente o link  -->
</body>
</html>
