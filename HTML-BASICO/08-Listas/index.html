<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>

    <h2>Lista de compras - Lista nao ordenada</h2>
    <ul>
        <li>Café</li>
        <li>Pão</li>
        <li>Bolo de cenoura</li>
    </ul>

    <!-- A tag UL seria a base da nossa lista, dentro dela temos que colocar as li que seriam os itens da nossa lista -->


    <h2>Ranking de pontos - Lista ordenada</h2>
    <ol>
        <li>Pedro - 100pts</li>
        <li>Lucas - 75pts</li>
        <li>Gustavo - 50pts</li>
    </ol>
</body>
</html>
