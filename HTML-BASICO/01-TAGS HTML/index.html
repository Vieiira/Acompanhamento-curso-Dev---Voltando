<!-- Temos sempre que abrir e fechar tags com o sinal de menor e maior (< >) e sempre que abrimos uma tag, devemos fechá-la. Por exemplo, a tag <ul> é aberta no início da lista e fechada no final da lista com </ul>. O mesmo acontece com a tag <li>, que é aberta para cada item da lista e fechada após o item.
    Caso eu nao feche minha tag ela pode "vazar" por todo meu codigo e acabar virando uma coisa só !!-->
