<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Tabelas</h1>

    <table>

        <thead>

            <tr>
                <th>Produto</th>
                <th>Tamanho</th>
                <th>Valor</th>
                <th>Quantidade</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td>Camisa</td>
                <td>M</td>
                <td>150$</td>
                <td>2</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <tr>
                    <td colspan="3">Total</td>
                    <td>300$</td>
                </tr>
            </tr>
        </tfoot>

    </table>


    <!-- primeiro vamos criar nossa tag table que sera a estrutura da tabela.
    logo em seguida vamos criar a thead que vai servir para colocar nosso cabeçalho, dentro dela vamo ter uma TR que seria a linha e dentro dessa linha temos as th, que seriam as colunas que aquela linha vai ter 

    No nosso Tbody vamo colocar os dados da nossa tabela, vamos criar uma linha, e dentro dessa linha vamos passar a td que seria os dados equivalentes as primeiras colunas que colocamos 

    E no TFoot vamos seguir o mesmo padrao, porem vamos usar para terminar a lista, colocando o total -->

</body>
</html>
