<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Página HTML</title>
</head>
<body>
    <h1>Minha Primeira Página HTML</h1>
</body>
</html>




<!-- 

<!DOCTYPE html> → diz que é HTML5

<html> → início da página HTML

<head> → configurações/informações da página

<meta charset="UTF-8"> → permite acentos e caracteres especiais

<meta name="viewport"...> → deixa o site responsivo

<title> → nome da aba do navegador

<body> → onde fica o conteúdo visível

</...> → fecha uma tag que foi aberta 

-->
